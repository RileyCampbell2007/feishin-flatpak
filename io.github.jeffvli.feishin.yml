app-id: io.github.jeffvli.feishin
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: '25.08'

command: feishin

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.mpris.MediaPlayer2.*
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.freedesktop.PowerManagement

modules:
  - name: luajit
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/LuaJIT/LuaJIT.git
        commit: a553b3de243b1ae07bdb21da4bdab77148793f76
      - type: shell
        commands:
          - sed -i 's|/usr/local|/app|' ./Makefile
    build-commands:
      - make
      - make install

  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        commit: e81dec4065332a907792af50e68b4a749e476718

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=enabled
      - -Dshaderc=enabled
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        commit: 2948be2e7bdb8797a3026677fd84e8c106107ff8

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dalsa=enabled
      - -Dpipewire=enabled
      - -Dpulse=enabled
      - -Dlua=enabled
      - -Dlibmpv=true
      - -Dwayland=disabled
      - -Dx11=disabled
      - -Degl=disabled
      - -Dgl=disabled
      - -Ddrm=disabled
      - -Dgbm=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        commit: 2c219aa822df18a1b7fd9abe3e151cd93ad67307

  - name: feishin
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/feishin
      - mkdir -p /app/share/icons/hicolor/512x512/apps
      - cp -r * /app/share/feishin/
      - install -Dm755 feishin-launcher.sh /app/bin/feishin
      - install -Dm644 resources/assets/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.jeffvli.feishin.png
      - install -Dm644 io.github.jeffvli.feishin.metainfo.xml /app/share/metainfo/io.github.jeffvli.feishin.metainfo.xml
      - install -Dm644 io.github.jeffvli.feishin.desktop /app/share/applications/io.github.jeffvli.feishin.desktop

    sources:
      - type: archive
        url: https://github.com/jeffvli/feishin/releases/download/v1.9.0/Feishin-linux-x64.tar.xz
        sha256: ddeed721758e309a3707a4a7c058b8e398a487b6cc118dfbd3209b819fb2af3d
      - type: script
        dest-filename: feishin-launcher.sh
        commands:
          - exec zypak-wrapper /app/share/feishin/feishin --ozone-platform-hint=auto "$@"

      - type: file
        path: io.github.jeffvli.feishin.desktop
      - type: file
        path: io.github.jeffvli.feishin.metainfo.xml
